name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build binaries for
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-latest, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          name=doubledip_${TAG#v}_${{ matrix.os }}_${{ matrix.arch }}
          mkdir -p dist/$name
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=${TAG#v}" -o dist/$name/doubledip ./cmd/doubledip
          cp README.md LICENSE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          ./dist/$name/doubledip -version
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz --clobber
