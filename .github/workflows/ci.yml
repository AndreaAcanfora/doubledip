name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install psycopg2 for the Python example
        run: sudo apt-get update && sudo apt-get install -y python3-psycopg2
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Test
        env:
          DOUBLEDIP_TEST_DB: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: go test -race ./...

  action:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE shop'
      - name: Run the action on the example shop
        id: dd
        uses: ./
        env:
          SHOP_DB: postgres://postgres:postgres@127.0.0.1:5432/shop
        with:
          version: source
          config: examples/shop/doubledip.yml
          fail-on-race: "false"
      - name: Expect the three vulnerable endpoints
        run: |
          echo "confirmed: ${{ steps.dd.outputs.confirmed }}"
          test "${{ steps.dd.outputs.confirmed }}" = 3
